nas:
  workgroup: WORKGROUP
  server_name: raspberrypi
  shares:
    - name: media
      path: /mnt/nas/media
      writable: true
      valid_users: "@nasusers"
    - name: backup
      path: /mnt/nas/backup
      writable: true
      valid_users: "@nasusers"

weather:
  # Options: openmeteo | mock | dht22 | bme280
  sensor: openmeteo
  latitude: 45.47
  longitude: 11.18
  interval: 600             # seconds between readings (10 min is enough for a public API)
  dht_gpio_pin: 4           # GPIO BCM pin for DHT22/DHT11 (used when sensor: dht22)
  bme280_i2c_address: "0x76"
  db_path: data/weather.db

irrigation:
  enabled: false            # set true when hardware is connected
  zones:
    - id: 1
      name: Front Garden
      gpio_pin: 17
      duration: 600         # default run time in seconds
    - id: 2
      name: Back Garden
      gpio_pin: 27
      duration: 600

web:
  host: "0.0.0.0"
  port: 5000
  debug: false
